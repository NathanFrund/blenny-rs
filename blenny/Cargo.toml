[package]
name = "blenny"
version = "0.1.0"
edition = "2024"

[features]
default = []
datastar-sse = ["datastar"]

[dependencies]
blenny-macros = { path = "../blenny-macros" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
inventory = "0.3"
tera = "1"
rust-embed = "8"
notify = { version = "8", features = ["macos_kqueue"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum-extra = { version = "0.12", features = ["cookie"] }
cookie = "0.18"
time = "0.3"
datastar = { version = "0.3", optional = true }
figment = { version = "0.10", features = ["json", "env"] }
thiserror = "2"
mime_guess = "2"
futures = "0.3"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "cookies", "stream"] }
tokio = { version = "1", features = ["full"] }
rstest = "0.23"
tokio-test = "0.4"
tokio-tungstenite = "0.21"
